<script>
const pages = {
  "Home": "https://eyk0001.github.io/Income-vs-Housing-Market/Income%20vs%20housing%20market.html",
  "Price Growth vs Wage Growth": "https://eyk0001.github.io/Income-vs-Housing-Market/Price%20Growth%20vs%20Wage%20Growth.html",
  "Can You Afford to Live Here": "https://eyk0001.github.io/Income-vs-Housing-Market/Can%20You%20Afford%20to%20Live%20Here.html"
};

const searchInput = document.getElementById("navSearch");
const resultsBox = document.getElementById("searchResults");

let suburbs = [];

// Load suburb names
d3.csv("medHousePrice.csv").then(function(data) {
  suburbs = data.map(d => d.Suburb);
});

searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase().trim();
  resultsBox.innerHTML = "";

  if (!query) {
    resultsBox.style.display = "none";
    return;
  }

  Object.keys(pages).forEach(page => {
    if (page.toLowerCase().includes(query)) {
      const item = createResultItem(page, () => {
        window.location.href = pages[page];
      });
      resultsBox.appendChild(item);
    }
  });

  suburbs
    .filter(suburb => suburb.toLowerCase().includes(query))
    .forEach(suburb => {
      const item = createResultItem(suburb, () => {
        window.location.href =
          "suburb.html?suburb=" + encodeURIComponent(suburb);
      });
      resultsBox.appendChild(item);
    });

  resultsBox.style.display =
    resultsBox.children.length > 0 ? "block" : "none";
});

function createResultItem(text, onClickAction) {
  const item = document.createElement("div");
  item.className = "resultItem";
  item.textContent = text;
  item.onclick = onClickAction;
  return item;
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-box")) {
    resultsBox.style.display = "none";
  }
});

	function updateClock() {
	  const now = new Date();

	  const hours = String(now.getHours()).padStart(2, '0');
	  const minutes = String(now.getMinutes()).padStart(2, '0');
	  const seconds = String(now.getSeconds()).padStart(2, '0');

	  document.getElementById("clock").textContent =
		`${hours}:${minutes}:${seconds}`;
	}

	setInterval(updateClock, 1000);
	updateClock();

</script>

<section class="split">
	<div class="left">
		<div id="suburbSelector">
		<label>Select Suburbs (Ctrl/Cmd + Click):</label><br>
		<select id="suburbSelect" multiple size="8" style="width:100px;"></select>
		</div>
	</div>

	<div class="right">
		<p>Text of some sort</p>
	</div>
</section>
<canvas id="myChart"></canvas>

<script>
let chart;

const params = new URLSearchParams(window.location.search);
const suburbFromURL = params.get("suburb");

d3.csv("medHousePrice.csv").then(data => {

    const quarters = data.columns.slice(1);
    const select = document.getElementById("suburbSelect");


    data.forEach(row => {
        const option = new Option(row.Suburb, row.Suburb);

        if (row.Suburb === suburbFromURL) {
            option.selected = true;
        }

        select.appendChild(option);
    });

    if (suburbFromURL) {
        document.getElementById("suburbSelector").style.display = "none";
    }

    chart = new Chart(document.getElementById("myChart"), {
        type: "line",
        data: {
            labels: quarters,
            datasets: []
        },
        options: {
            responsive: true,
			maintainAspectRatio: false,
            plugins: {
                legend: { position: "top" }
            },
            scales: {
                y: {
                    ticks: {
                        callback: v => "$" + v.toLocaleString()
                    }
                }
            }
        }
    });

    function updateChart() {

        const selected = Array.from(select.selectedOptions)
                              .map(o => o.value);

        chart.data.datasets = selected.map((suburb, i) => {
            const row = data.find(d => d.Suburb === suburb);

            return {
                label: suburb,
                data: quarters.map(q => +row[q]),
                borderColor: getColor(i),
                backgroundColor: getColor(i),
                fill: false,
                tension: 0.2
            };
        });

        chart.update();
    }

    select.addEventListener("change", updateChart);

    if (suburbFromURL) updateChart();

});

function getColor(i) {
    return `hsl(${(i * 137.5) % 360},70%,50%)`;
}
</script>
