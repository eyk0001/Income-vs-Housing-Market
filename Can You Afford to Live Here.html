<body>

	<h1>Can You Afford to Live Here</h1>
	<section id="calculator">
		<input type="search" id="suburb" placeholder="Suburb">
		<br>
		<input type="number" id="income" placeholder="Annual income">
		<br>
		<input type="number" id="price" placeholder="House price">
		<br>
		<button onclick="calculateAffordability()">Check</button>
    <p id="result"></p>

	<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
const pages = {
  "Home": "https://eyk0001.github.io/Income-vs-Housing-Market/Income%20vs%20housing%20market.html",
  "About this website": "https://eyk0001.github.io/Income-vs-Housing-Market/About%20this%20website.html",
  "Can You Afford to Live Here": "https://eyk0001.github.io/Income-vs-Housing-Market/Can%20You%20Afford%20to%20Live%20Here.html"
};

const searchInput = document.getElementById("navSearch");
const resultsBox = document.getElementById("searchResults");

let suburbs = [];

d3.csv("medHousePrice.csv").then(function(data) {
  suburbs = data.map(d => d.Suburb);
});

searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase().trim();
  resultsBox.innerHTML = "";

  if (!query) {
    resultsBox.style.display = "none";
    return;
  }

  Object.keys(pages).forEach(page => {
    if (page.toLowerCase().includes(query)) {
      const item = createResultItem(page, () => {
        window.location.href = pages[page];
      });
      resultsBox.appendChild(item);
    }
  });

  suburbs
    .filter(suburb => suburb.toLowerCase().includes(query))
    .forEach(suburb => {
      const item = createResultItem(suburb, () => {
        window.location.href =
          "suburb.html?suburb=" + encodeURIComponent(suburb);
      });
      resultsBox.appendChild(item);
    });

  resultsBox.style.display =
    resultsBox.children.length > 0 ? "block" : "none";
});

function createResultItem(text, onClickAction) {
  const item = document.createElement("div");
  item.className = "resultItem";
  item.textContent = text;
  item.onclick = onClickAction;
  return item;
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-box")) {
    resultsBox.style.display = "none";
  }
});

	function updateClock() {
	  const now = new Date();

	  const hours = String(now.getHours()).padStart(2, '0');
	  const minutes = String(now.getMinutes()).padStart(2, '0');
	  const seconds = String(now.getSeconds()).padStart(2, '0');

	  document.getElementById("clock").textContent =
		`${hours}:${minutes}:${seconds}`;
	}

	setInterval(updateClock, 1000);
	updateClock();



function calculateAffordability() {

  const income = parseFloat(document.getElementById("income").value);
  const priceInput = document.getElementById("price").value;
  const suburbInput = document.getElementById("suburb").value;

  if (!income) {
    alert("Please enter your annual income.");
    return;
  }

  let housePrice;

  if (priceInput) {
    housePrice = parseFloat(priceInput);
  }

  else if (suburbInput) {
    const suburbData = suburbsData.find(
      s => s.Suburb.toLowerCase() === suburbInput.toLowerCase()
    );

    if (!suburbData) {
      alert("Suburb not found in dataset.");
      return;
    }

    housePrice = parseFloat(suburbData.Q4_2023.replace(/,/g,""));
  }

  else {
    alert("Enter either a suburb or house price. Not both...");
    return;
  }

  const maxAffordable = income * 5;
  const ratio = housePrice / income;

  let result;

  if (ratio <= 5) {
    result = "Affordable";
  } else if (ratio <= 7) {
    result = "Plausible";
  } else {
    result = "Not affordable";
  }

  document.getElementById("result").innerHTML =
    `House Price: $${housePrice.toLocaleString()} <br>
     Max Affordable: $${maxAffordable.toLocaleString()} <br>
     Result: ${result}`;
}

</script>
